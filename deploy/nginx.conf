# teyes-sibir.ru на VPS Beget: статика боевой сборки (/srv/current → releases/<дата>), наружу – через общий Caddy.
# HTML лежит сжатым (index.html.gz + пустой index.html для try_files): gzip_static always, gunzip – для клиентов без gzip.
map $uri $teyes_redirect {
  default "";
  include /etc/nginx/redirects.map;
}
server {
  listen 8080;
  server_name _;
  root /srv/current;
  absolute_redirect off;
  server_tokens off;
  charset utf-8;
  gzip_static always;
  gunzip on;
  if ($teyes_redirect) { return 301 $teyes_redirect; }
  location ~ ^/(_astro|assets|img)/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
